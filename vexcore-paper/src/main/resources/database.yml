storage: postgresql

# All Paper and Velocity instances in one network must use the same Redis and SQL namespace.
# Enable Redis on every instance together after stopping all legacy SQL writers.
redis:
  enabled: false
  host: localhost
  port: 6379
  username: default
  password: change-me
  database: 0
  ssl: false
  key-prefix: "vexcore:production:"
  client-name: "vexcore-paper"
  connect-timeout-millis: 3000
  command-timeout-millis: 1500
  maximum-pending-commands: 4096
  maximum-journal-entries: 1000000

persistence:
  checkpoint-interval-seconds: 300

player-data:
  login-timeout-seconds: 15
  login-kick-message: "Your player data could not be loaded. Please try again."

# SQLite is intended for one standalone Paper server. Use PostgreSQL when a proxy or
# multiple VexCore server instances need to share data.
sqlite:
  # Path relative to the VexCore configuration directory.
  file: vexcore.db

postgresql:
  jdbc-url: jdbc:postgresql://localhost:5432/vexcore
  username: postgres
  password: change-me
  maximum-pool-size: 10
  auto-create-database: true
  maintenance-database: postgres
