vexcore:
  reload:
    success: "<tailwind:zinc:4>VexCore was reloaded <tailwind:lime>successfully"
    failed: "<tailwind:red>VexCore could not be reloaded, <tailwind:red:7>check the console for details"
  currency:
    given: '<tailwind:lime>Credit successful:<tailwind:zinc:4> %value% <tailwind:zinc:4>for <tailwind:violet:5>%player%<tailwind:zinc:4>.'
    received: '<tailwind:zinc:4>You have <tailwind:lime>received<tailwind:zinc:4> %value%<tailwind:zinc:4>.'
    balance: '<tailwind:zinc:4>Balance of <tailwind:violet:5>%player%<tailwind:zinc:4>: %value%'
    unknown: '<tailwind:red>The currency <tailwind:red:7>%currency%<tailwind:red> is not registered.'
    ambiguous: '<tailwind:red>The currency <tailwind:red:7>%currency%<tailwind:red> is ambiguous. Use the full ID with a dot from tab completion.'
    invalid-amount: '<tailwind:red>Enter a positive whole amount, for example <tailwind:red:7>250, 5m or 15aa<tailwind:red>.'
    player-only: '<tailwind:red>Specify a target player when running this command from the console.'
    player-offline: '<tailwind:red>The player <tailwind:red:7>%player%<tailwind:red> is offline or their data is not loaded yet.'
    maximum-exceeded: '<tailwind:red>The credit would exceed the balance limit.'
    unavailable: '<tailwind:red>The currency or player data is currently unavailable.'
  language:
    set: "<tailwind:zinc:4>Your language was changed to <tailwind:sky>%language%"
    not-found: "<tailwind:red>The language <tailwind:red:7>%language%<tailwind:red> is not available"
  reset:
    player-container:
      success: "<tailwind:zinc:4>Reset <tailwind:sky>%container%<tailwind:zinc:4> for <tailwind:sky>%player%"
    player-all:
      success: "<tailwind:zinc:4>Reset all containers for <tailwind:sky>%player%"
    global-container:
      success: "<tailwind:zinc:4>Reset <tailwind:sky>%container%<tailwind:zinc:4> for every player"
    global-all:
      success: "<tailwind:zinc:4>Reset all containers for every player"
    player-not-found: "<tailwind:red>No stored player was found for <tailwind:red:7>%player%"
    failed: "<tailwind:red>The reset failed, <tailwind:red:7>check the console for details"
  debug:
    performance:
      enabled: "<tailwind:zinc:4>The live performance display is now <tailwind:lime>enabled"
      disabled: "<tailwind:zinc:4>The live performance display is now <tailwind:red>disabled"
    proxy:
      ping:
        started: "<tailwind:zinc:4>Sending a ping to the <tailwind:sky>Velocity proxy<tailwind:zinc:4>..."
        success: "<tailwind:zinc:4>Velocity responded in <tailwind:lime>%latency% ms"
        timeout: "<tailwind:red>The Velocity proxy did not respond within <tailwind:red:7>5 seconds"
        failed: "<tailwind:red>Unable to send the proxy ping: <tailwind:red:7>%reason%"
