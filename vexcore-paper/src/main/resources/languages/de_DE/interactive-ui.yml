started: '<tailwind:zinc:4>Interaktive UI geöffnet. Lade das separate <tailwind:sky>VexCore Interactive UI Pack<tailwind:zinc:4>. Bewege die Maus, klicke oder halte die linke Maustaste zum Ziehen. <tailwind:amber>Shift<tailwind:zinc:4> schließt die UI.'
