  width: 480
  columns: 3
  page-size: 9
  gap: 4
  card-height: 36

# Only sprites registered in the format-1 VexUI pack are valid here.
categories:
  farming: [POTATO, CARROT, WHEAT, SUGAR_CANE, BEETROOT, APPLE, BREAD, MELON_SLICE, PUMPKIN_PIE, SWEET_BERRIES, COOKIE, GOLDEN_CARROT]
