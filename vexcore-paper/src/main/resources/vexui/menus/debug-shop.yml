  tools: [IRON_SWORD, DIAMOND_SWORD, IRON_PICKAXE, DIAMOND_PICKAXE, IRON_AXE, DIAMOND_AXE, IRON_SHOVEL, DIAMOND_SHOVEL, IRON_HOE, DIAMOND_HOE, SHEARS, FISHING_ROD]

