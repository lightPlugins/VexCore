name: VexCore
version: ${version}
main: dev.vexsoft.core.paper.VexCorePlugin
api-version: "1.21"
load: STARTUP
description: Modular infrastructure for VexSoft Paper plugins
folia-supported: true
libraries:
  - com.zaxxer:HikariCP:6.3.0
  - org.postgresql:postgresql:42.7.8
permissions:
  vexcore.command.reload:
    description: Allows reloading VexCore localizations
    default: op
  vexcore.command.language:
    description: Allows changing the personal language
    default: true
