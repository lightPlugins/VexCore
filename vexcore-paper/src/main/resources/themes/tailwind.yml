# Tailwind theme shared by all VexSoft plugins.
# Browse the complete palette at:
# https://htmlcolorcodes.com/color-chart/tailwind-color-chart/
#
# Every color family contains 11 shades ordered from lightest (1) to darkest (11).
# Shade 6 is the default and can be omitted:
#   <tailwind:sky>Text</tailwind:sky>      -> sky shade 6
#   <tailwind:sky:7>Text</tailwind:sky:7> -> sky shade 7
#
# VexSoft plugins mainly use these colors to keep all messages consistent:
#   zinc   - normal text
#   sky    - primary color, important values and neutral highlights
#   lime   - successful actions and positive states
#   amber  - warnings and states that require attention
#   red    - errors, failed actions and negative states
#   zinc:7 - separators and secondary structural elements
#   red:7  - important details inside a complete red error message
#
# All other color families remain available for custom messages and designs.
